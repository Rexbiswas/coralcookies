<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Cookie Gradient -->
    <radialGradient id="cookieBase" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F5DBB8" />
      <stop offset="55%" stop-color="#D48C45" />
      <stop offset="100%" stop-color="#8C4A1B" />
    </radialGradient>

    <!-- Outer Glow / Coral Accent Shadow -->
    <filter id="coralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF7F50" flood-opacity="0.4" />
    </filter>

    <!-- Dark Chocolate Chip Gradient -->
    <linearGradient id="chocChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2B20" />
      <stop offset="100%" stop-color="#1F100B" />
    </linearGradient>

    <linearGradient id="chocChipHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E382B" />
      <stop offset="100%" stop-color="#2B1810" />
    </linearGradient>

    <!-- Coral Accent Sparkle Gradient -->
    <linearGradient id="coralAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E79" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
  </defs>

  <!-- Soft Base Drop Shadow -->
  <ellipse cx="50" cy="54" rx="42" ry="40" fill="#150A08" opacity="0.45" />

  <!-- Main Organic Cookie Body -->
  <path d="M 50 8 
           C 67 7, 84 15, 91 30 
           C 98 45, 95 64, 87 77 
           C 79 89, 61 94, 46 93 
           C 30 92, 13 83, 8 66 
           C 3 50, 8 32, 19 19 
           C 30 8, 38 9, 50 8 Z" 
        fill="url(#cookieBase)" 
        filter="url(#coralGlow)" />

  <!-- Outer Cookie Rim Texture -->
  <path d="M 50 11 
           C 65 10, 80 17, 87 31 
           C 93 44, 90 61, 83 73 
           C 76 84, 59 89, 45 88 
           C 31 87, 16 79, 12 64 
           C 7 50, 11 34, 21 21 
           C 31 11, 39 12, 50 11 Z" 
        fill="none" 
        stroke="#7A3E14" 
        stroke-width="2.5" 
        opacity="0.25" />

  <!-- Chocolate Chips -->
  <!-- Chip 1 (Top Left) -->
  <path d="M 31 24 C 37 20, 42 27, 39 34 C 34 38, 26 35, 27 29 C 27 26, 29 25, 31 24 Z" fill="url(#chocChipHighlight)" />
  <circle cx="33" cy="28" r="1.5" fill="#8C5344" opacity="0.7" />

  <!-- Chip 2 (Center Right) -->
  <path d="M 63 35 C 73 32, 75 42, 70 47 C 63 51, 56 45, 60 38 C 61 36, 62 35, 63 35 Z" fill="url(#chocChip)" />
  <circle cx="65" cy="40" r="1.8" fill="#8C5344" opacity="0.7" />

  <!-- Chip 3 (Bottom Left) -->
  <path d="M 33 57 C 43 54, 44 65, 38 70 C 30 73, 25 64, 30 59 C 31 58, 32 57, 33 57 Z" fill="url(#chocChip)" />
  <circle cx="35" cy="62" r="1.5" fill="#8C5344" opacity="0.7" />

  <!-- Chip 4 (Top Right Small) -->
  <path d="M 55 17 C 62 15, 63 23, 58 26 C 53 27, 50 21, 55 17 Z" fill="url(#chocChipHighlight)" />

  <!-- Chip 5 (Bottom Right Small) -->
  <path d="M 67 63 C 74 61, 74 70, 68 72 C 61 74, 61 66, 67 63 Z" fill="url(#chocChip)" />

  <!-- Chip 6 (Center) -->
  <path d="M 43 41 C 51 39, 52 47, 47 50 C 40 52, 38 45, 43 41 Z" fill="url(#chocChipHighlight)" />

  <!-- Coral Sparkle (Branded Star Top Right) -->
  <path d="M 82 17 C 82 22 84 24 89 24 C 84 24 82 26 82 31 C 82 26 80 24 75 24 C 80 24 82 22 82 17 Z" fill="url(#coralAccent)" />

  <!-- Warm Crumbs -->
  <circle cx="21" cy="74" r="2.5" fill="#D48C45" />
  <circle cx="78" cy="53" r="2" fill="#8C4A1B" />
  <circle cx="25" cy="18" r="1.5" fill="#FF7F50" />
</svg>
